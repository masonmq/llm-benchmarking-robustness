<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Annotation sign in</title><link rel="stylesheet" href="style.css"></head><body><article style="max-width:460px;margin:10vh auto;min-height:0"><h1 style="color:#17324d">Annotation sign in</h1><p>Enter your assigned name and the study password.</p><div class="questions"><label>Name<input id="name" style="padding:9px"></label><label>Password<input id="password" type="password" style="padding:9px"></label><button class="primary" id="login">Sign in</button><p id="error" class="warning" hidden></p></div></article><script src="config.js"></script><script src="api.js"></script><script>document.querySelector('#login').onclick=async()=>{const r=await apiFetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({annotator:document.querySelector('#name').value,password:document.querySelector('#password').value})});const d=await r.json();if(r.ok){if(d.token)localStorage.setItem('annotation-token',d.token);location.href='./'}else{const e=document.querySelector('#error');e.hidden=false;e.textContent=d.error||'Sign-in failed'}};</script></body></html>
